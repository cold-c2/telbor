<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PALE FIELD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --pale: #d8d8d8; --dim: #6a6f75; --red: #c21b1b; }
  html, body { height: 100%; background: #05070c; color: var(--pale);
    font-family: "Press Start 2P", "Courier New", monospace; -webkit-font-smoothing: none; image-rendering: pixelated; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; overflow-x: hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, #10161f 0%, #070a10 45%, #04060b 100%); }

  .rec { position: fixed; top: 16px; left: 18px; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .rec .dot { color: var(--red); animation: blink 1.1s steps(1) infinite; }
  .date { position: fixed; top: 16px; right: 18px; font-size: 10px; color: var(--dim); }
  @keyframes blink { 50% { opacity: 0; } }

  h1 { font-size: clamp(22px, 6vw, 52px); letter-spacing: 4px; line-height: 1.35;
    text-shadow: 0 0 18px rgba(180,190,200,0.18), 3px 3px 0 #000; }
  .sub { margin-top: 22px; font-size: 10px; color: var(--dim); letter-spacing: 2px; line-height: 1.9; }

  /* dark tree-line "image of the game" */
  .scene { position: relative; width: min(680px, 92vw); height: 150px; margin: 34px 0 30px;
    background: linear-gradient(#0a0f16 0%, #0c1219 55%, #10151b 100%);
    border: 1px solid #161c25; overflow: hidden; box-shadow: 0 0 40px #000 inset; }
  .scene::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(10,14,20,0) 40%, rgba(12,16,22,0.9) 100%); }
  .fog { position: absolute; inset: 0; background:
    radial-gradient(60% 80% at 50% 120%, rgba(180,186,192,0.16), transparent 70%); }
  .tree { position: absolute; bottom: 8px; width: 0; height: 0;
    border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 46px solid #0d1a12; }
  .tree.b { border-bottom-color: #0a140e; transform: scale(1.5); }
  .fig { position: absolute; bottom: 12px; left: 50%; width: 8px; height: 26px; background: #c9c9cc;
    transform: translateX(-50%); box-shadow: 0 0 10px rgba(220,220,225,0.35); }

  .btns { display: flex; flex-direction: column; gap: 14px; width: min(340px, 86vw); }
  a.btn { display: block; padding: 15px 10px; font-family: inherit; font-size: 11px; letter-spacing: 2px;
    color: var(--pale); text-decoration: none; background: #0c1119; border: 1px solid #232b36;
    transition: background .12s, border-color .12s, transform .05s; }
  a.btn:hover { background: #131b26; border-color: #3a4657; }
  a.btn:active { transform: translateY(1px); }
  a.btn.primary { border-color: #43525f; }
  a.btn small { color: var(--dim); font-size: 8px; }

  footer { margin-top: 30px; font-size: 8px; color: #2f353d; letter-spacing: 1px; line-height: 1.8; }
  footer a { color: #444b55; text-decoration: none; }
</style>
</head>
<body>
  <div class="rec"><span class="dot">●</span> REC</div>
  <div class="date">01.02.2008</div>

  <h1>PALE&nbsp;FIELD</h1>
  <div class="sub">a cold place.<br>bring a rifle.</div>

  <div class="scene" aria-hidden="true">
    <div class="fog"></div>
    <div class="tree" style="left:6%"></div>
    <div class="tree b" style="left:20%"></div>
    <div class="tree" style="left:34%"></div>
    <div class="tree b" style="left:70%"></div>
    <div class="tree" style="left:84%"></div>
    <div class="tree" style="left:92%"></div>
    <div class="fig"></div>
  </div>

  <div class="btns">
    <a class="btn primary" href="./play.html?fs=1">▶ ENTER FULLSCREEN</a>
    <a class="btn" href="./play.html">◱ ENTER (WINDOWED)</a>
    <a class="btn" href="https://github.com/cold-c2/telbor/releases">⬇ DOWNLOAD .EXE <small>(desktop)</small></a>
  </div>

  <footer>
    WASD move · MOUSE look · RMB aim · 1/2 equip · CTRL crouch · TAB editor<br>
    <a href="https://github.com/cold-c2/telbor">github.com/cold-c2/telbor</a>
  </footer>
</body>
</html>
