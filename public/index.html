<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>REC ␣ 01.02.2008</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; cursor: default; }
  body { font-family: "Courier New", monospace; }

  /* The 3D canvas is rendered small and stretched -> chunky nearest-neighbor pixels */
  #view {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block;
  }

  /* overlays sit above the game, ignore clicks */
  .overlay { position: fixed; inset: 0; pointer-events: none; }

  /* film grain */
  #grain { opacity: 0.10; mix-blend-mode: overlay; z-index: 5; }

  /* vignette + slight desaturation frame */
  #vignette {
    z-index: 6;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }

  /* camcorder HUD */
  #hud { z-index: 8; color: #d8d8d8; text-shadow: 0 0 2px #000, 1px 1px 0 #000; font-size: 20px; letter-spacing: 1px; }
  #rec { position: absolute; top: 18px; left: 22px; display: flex; align-items: center; gap: 9px; }
  #recdot { width: 13px; height: 13px; border-radius: 50%; background: #d31b1b; box-shadow: 0 0 6px #d31b1b; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #date { position: absolute; top: 18px; right: 22px; text-align: right; }
  #batt { position: absolute; bottom: 18px; right: 22px; opacity: 0.85; }
  #tracking { position: absolute; bottom: 18px; left: 22px; opacity: 0.7; font-size: 15px; }

  /* tiny click-to-look hint (pointer lock needs one user gesture); hides once locked */
  #gate {
    position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%); z-index: 20;
    color: #cfcfcf; background: rgba(0,0,0,0.5); border: 1px solid #444;
    padding: 8px 18px; font-size: 13px; letter-spacing: 2px; cursor: pointer;
  }
  #gate.hidden { display: none; }

  /* placement crosshair (shown in editor) */
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7;
    width: 6px; height: 6px; border-radius: 50%; background: rgba(230,230,230,0.7);
    box-shadow: 0 0 2px #000; pointer-events: none; display: none;
  }
  #crosshair.on { display: block; }

  /* editor HUD */
  #editor {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9; display: none;
    padding: 10px 16px; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0));
    color: #cfe8cf; font-family: "Courier New", monospace; font-size: 13px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000; pointer-events: none;
  }
  #editor.on { display: block; }
  #editor b { color: #9fe89f; }
  #editor .k { color: #e8d89f; }

  #count { position: absolute; top: 52px; left: 22px; z-index: 8; color: #9a9a9a; font-size: 14px; text-shadow: 1px 1px 0 #000; }
  #fps { position: fixed; top: 72px; left: 22px; z-index: 8; color: #84c884; font-family: "Courier New", monospace; font-size: 14px; text-shadow: 1px 1px 0 #000; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/three/three.module.js",
  "three/addons/": "/three/addons/"
} }
</script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="nightfade" class="overlay" style="z-index:4;background:#04060c;opacity:0;transition:opacity .5s linear;"></div>
  <canvas id="grain" class="overlay"></canvas>
  <div id="vignette" class="overlay"></div>

  <div id="hud" class="overlay">
    <div id="rec"><span id="recdot"></span><span>REC</span></div>
    <div id="date">01.02.2008<br><span id="clock" style="font-size:15px;opacity:.8"></span></div>
    <div id="batt">▮▮▮▯ </div>
    <div id="tracking">▓ TRACKING ▓</div>
  </div>
  <div id="count" class="overlay">wanderers online: 1</div>
  <div id="fps">fps —</div>
  <div id="crosshair"></div>

  <div id="editor">
    <b>◈ MAP EDITOR</b> &nbsp; <span id="ed-asset">—</span>
    &nbsp; rot <span id="ed-rot">0°</span> · scale <span id="ed-scale">1.0</span>
    &nbsp; · placed <span id="ed-count">0</span>
    <br>
    <span class="k">[ ]</span>/wheel palette · <span class="k">click</span> place · <span class="k">R</span> rotate ·
    <span class="k">+/-</span> scale · <span class="k">Space/C</span> fly · <span class="k">Backspace</span> delete ·
    <span class="k">P</span> save · <span class="k">Tab</span> exit
  </div>

  <div id="gate">click to look around</div>

  <script type="module" src="/main.js"></script>
</body>
</html>
